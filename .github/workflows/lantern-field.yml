name: Lantern field sketch

on:
  push:
    paths:
      - 'sketches/lantern-field/**'
      - '.github/workflows/lantern-field.yml'
  pull_request:
    paths:
      - 'sketches/lantern-field/**'
      - '.github/workflows/lantern-field.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04  # the image these checks were verified on; ubuntu-latest becomes 26.04 from 19 Oct 2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r sketches/lantern-field/requirements.txt
      - run: python -m unittest discover -s sketches/lantern-field -p 'test_*.py' -v
      - run: python sketches/lantern-field/render.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lantern-field-listening-sketch
          path: sketches/lantern-field/renders/
          retention-days: 14
