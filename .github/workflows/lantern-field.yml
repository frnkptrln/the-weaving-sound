name: Lantern field sketch

on:
  push:
    paths:
      - 'sketches/lantern-field/**'
      - '.github/workflows/lantern-field.yml'
  pull_request:
    paths:
      - 'sketches/lantern-field/**'
      - '.github/workflows/lantern-field.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r sketches/lantern-field/requirements.txt
      - run: python -m unittest discover -s sketches/lantern-field -p 'test_*.py' -v
      - run: python sketches/lantern-field/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-field-listening-sketch
          path: sketches/lantern-field/renders/
          retention-days: 14
