name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-24.04  # the image these checks were verified on; ubuntu-latest becomes 26.04 from 19 Oct 2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: |
          for script in pieces/*/*.sh; do
            bash -n "$script" || exit
          done
  audio:
    # The recorded hashes are only meaningful with the toolchain they were built
    # with (SuperCollider 3.13.0 from Ubuntu 24.04); ubuntu-latest moves to
    # Ubuntu 26 from 19 October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends supercollider-language supercollider-server sc3-plugins
      - name: Compile and render without audio hardware
        run: python scripts/validate_audio.py
      - name: Render complete finite scores and validate their audio
        run: python scripts/render_piece.py phase-weave spectral-memory
      - name: Install the remaining renderer dependencies for the listening test
        run: |
          sudo apt-get install -y --no-install-recommends espeak
          python -m pip install -r pieces/rooms-change-us/requirements.txt
      - name: Listening test, every piece against manifest.json
        run: python -m unittest -v tests.test_listening
