name: listening page

# Builds site/index.html from manifest.json and the pieces' READMEs and
# publishes it with GitHub Pages. The build runs on every relevant push; the
# deployment runs only once Pages is enabled for the repository with
# "GitHub Actions" as its source (Settings → Pages), so the workflow is inert
# but green until then.

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - "pieces/*/README.md"
      - scripts/build_site.py
      - .github/workflows/listening-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: listening-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04  # the image these checks were verified on; ubuntu-latest becomes 26.04 from 19 Oct 2026
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the page from the manifest
        run: |
          python scripts/build_site.py --output _site/index.html
          python -m unittest -v tests.test_build_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Is Pages enabled for this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh prints the 404 body to stdout when Pages is not enabled; only a successful call counts
          if kind=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null) && [ "$kind" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not enabled with GitHub Actions as its source; the page was built but not deployed." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
